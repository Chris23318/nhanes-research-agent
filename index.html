<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NHANES 流行病学研究 AI Agent"><title>NHANES Lab</title><link rel="stylesheet" href="styles.css"><style>.recent-projects{display:flex;flex-direction:column;gap:4px}.recent-projects small{padding:8px 10px;color:#78958a;font-size:9px}.recent-project{border:0;background:transparent;color:#bdd0c7;text-align:left;padding:9px 10px;border-radius:4px;cursor:pointer;font:11px/1.35 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-project:hover,.recent-project.selected{background:#21483b;color:#fff}.recent-project span{display:block;color:#78958a;font-size:8px;margin-top:3px}.recent-project.selected span{color:#a8c0b6}.catalog-search{display:grid;grid-template-columns:140px 120px 1fr auto;gap:8px;margin:15px 0}.catalog-search select,.catalog-search input,.catalog-search button{border:1px solid #dfe3dc;background:#fff;padding:9px;font:10px inherit;min-width:0}.catalog-results{border:1px solid #e3e7e2;background:#fafbf8;padding:12px;margin-bottom:15px;max-height:280px;overflow:auto}.catalog-results>small{color:#68736d}@media(max-width:700px){.catalog-search{grid-template-columns:1fr}}</style></head><body>
<div class="layout"><aside><div class="brand"><b>N</b><span>NHANES <small>LAB</small></span></div><button id="newStudy" class="new">＋ 新建研究</button><nav><label>工作区</label><a class="active">⌁ 研究工作台</a><a>⌕ 变量词典</a><a>▤ 文献库</a><label>最近研究</label><div id="recentProjects" class="recent-projects"><small>正在加载…</small></div></nav><div class="profile"><span>YL</span><div>研究员<small>云端研究环境</small></div></div></aside>
<main><header><span>研究项目　/　<b id="headerProjectTitle">未命名研究</b></span><span class="online">● 数据服务正常</span></header>
<section id="start" class="hero"><p class="kicker">NHANES RESEARCH COPILOT</p><h1>把研究问题，变成<br><em>可复现的证据。</em></h1><p>从变量识别、文献检索到加权分析与报告生成，一处完成。</p><div class="prompt"><textarea id="question" placeholder="描述研究问题，例如：探讨美国成年人血清维生素 D 水平与抑郁症状的关联……"></textarea><div><span><button data-add="限定 20 岁以上成年人">＋ 人群</button><button data-add="使用 2007–2018 周期">＋ 周期</button><button data-add="进行亚组与敏感性分析">＋ 分析要求</button></span><button id="run" class="primary">开始研究　→</button></div></div><div class="examples">试试： <button data-example="探讨美国 20 岁以上成年人血清维生素 D 水平与抑郁症状的关联，使用 2007–2018 年 NHANES 数据。">维生素 D 与抑郁</button><button data-example="分析膳食炎症指数与慢性肾病风险的关联，并按性别分层。">膳食炎症与 CKD</button><button data-example="研究睡眠时长和心血管疾病风险的非线性关系。">睡眠与心血管风险</button></div></section>
<section id="results" class="results hidden"><div class="study-head"><div><p id="studyCycle" class="kicker">ACTIVE STUDY · NHANES</p><h2 id="studyTitle">未命名研究</h2><p id="studyPopulation">等待解析目标人群</p></div><div><button id="export">↓ 导出方案</button><button id="continue" class="primary">确认研究方案 →</button></div></div><div id="pipeline" class="pipeline"></div><div class="workgrid"><section class="panel"><div class="tabs"><button class="active" data-tab="design">研究方案</button><button data-tab="variables">变量映射</button><button data-tab="literature">文献证据</button><button data-tab="code">分析代码</button><button data-tab="qc">质量检查</button></div><div id="tabContent" class="content"></div></section><aside class="agent"><h3>✦　Agent 运行记录</h3><div id="logs"></div><div id="researcherWarning" class="warning"><b>!　研究者确认点</b><br>请确认自动识别结果和变量映射后再执行分析。</div></aside></div></section>
</main></div><dialog id="approvalDialog" style="max-width:620px;width:calc(100% - 32px);border:1px solid #cbd2ca;padding:24px;color:#17211d"><form id="approvalForm"><div class="title"><h3>确认并冻结研究方案</h3><button type="button" id="cancelApproval">×</button></div><p style="font-size:11px;color:#68736d">以下决定会写入审计记录。批准后，如需修改主要方案，应创建新的分析版本。</p><div class="design"><label class="card">结局定义<input id="approvalOutcome" required maxlength="300" value="PHQ-9 ≥ 10" style="width:100%;margin-top:8px;padding:8px"></label><label class="card">暴露参数化<select id="approvalExposure" style="width:100%;margin-top:8px;padding:8px"><option>每增加 10 nmol/L</option><option>加权四分位数</option><option>连续值与四分位数并行</option></select></label><label class="card">协变量集合<select id="approvalCovariates" style="width:100%;margin-top:8px;padding:8px"><option>年龄、性别、种族/族裔、PIR、BMI</option><option>最小调整集</option><option>扩展调整集</option></select></label><label class="card">缺失值策略<select id="approvalMissing" style="width:100%;margin-top:8px;padding:8px"><option>完整案例分析</option><option>多重插补并做完整案例敏感性分析</option></select></label></div><label style="display:block;margin:16px 0;font-size:11px;line-height:1.6"><input id="approvalAssociation" type="checkbox" required> 我确认这是横断面关联研究，结果不得解释为因果效应。</label><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" id="cancelApprovalBottom">取消</button><button type="submit" class="primary" style="padding:10px 16px">确认并冻结方案</button></div></form></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
