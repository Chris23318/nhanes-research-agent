name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

  deploy-aliyun:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ALIYUN_AUTO_DEPLOY == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure restricted SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.ALIYUN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aliyun_deploy"
          chmod 600 "$HOME/.ssh/aliyun_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stream verified release to Aliyun
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          git archive --format=tar.gz --output=release.tar.gz "$GITHUB_SHA"
          ssh \
            -i "$HOME/.ssh/aliyun_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@"$ALIYUN_HOST" \
            "deploy $GITHUB_SHA" < release.tar.gz
      - name: Remove runner credentials
        if: always()
        run: rm -f "$HOME/.ssh/aliyun_deploy" release.tar.gz
