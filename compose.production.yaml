services:
  app:
    image: ${APP_IMAGE:-ghcr.io/chris23318/nhanes-research-agent:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      NCBI_EMAIL: ${NCBI_EMAIL:?Set NCBI_EMAIL in .env}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_PATH: /data/nhanes.sqlite
    expose:
      - "4173"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - app_data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  app_data:
  caddy_data:
  caddy_config:
